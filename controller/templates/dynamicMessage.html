<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Mail From SuperMart</title>
  <style>
    body {
      background: #198cd8;
      padding: 0;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .container {
      background: #ffffff;
      width: 600px;
      margin: auto;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
      color: #222;
      border-bottom: 2px solid #f1f1f1;
      padding-bottom: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    table th, table td {
      padding: 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
      font-size: 14px;
    }
    .total {
      font-size: 16px;
      font-weight: bold;
      color: #000;
    }
    .footer {
      text-align: center;
      font-size: 12px;
      color: #888;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>📧 Message from SuperMart</h2>

    <p>{{message}}</p>

    <div class="footer">
      <p>Kamatchi Grocery Store</p>
    </div>
  </div>
</body>
</html>
